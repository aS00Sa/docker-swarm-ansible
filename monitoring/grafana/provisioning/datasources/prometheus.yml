apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Bethome Prometheus
    uid: bethome-prometheus
    type: prometheus
    access: proxy
    # Swarm stack bethome-infra, service bethome-prometheus (rabbit-shared/bethome-infra.yml)
    url: http://bethome-prometheus:9090
    isDefault: false
    editable: true
